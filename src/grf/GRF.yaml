grf:
  grfid: BRM3
  short_name: BRMetro
  name: BRMetro
  description: UK tram and metro vehicles for BRTrains

versioning:
  version: 1
  compatible_version: 1

purchase_list:
  order: grouped

params:
  - identifier: param_speed_mode
    name_str: Speed Mode
    desc_str: Use each unit's design speed, or its permitted service speed
    min_value: 0
    max_value: 1
    def_value: 1
    names:
      0: Service Speed
      1: Design Speed

  - identifier: param_capacity_scaling
    name_str: Capacity Scaling
    desc_str: Scale vehicle capacities
    min_value: 1
    max_value: 4
    def_value: 1
    names:
      1: 1x
      2: 2x
      3: 3x
      4: 4x

  - identifier: param_disable_default_trains
    name_str: Hide Default OpenTTD trains?
    desc_str: Hide the default OpenTTD trains from the vehicle list
    min_value: 0
    max_value: 1
    def_value: 1
    names:
      0: Show Default OpenTTD trains
      1: Hide Default OpenTTD trains

  - identifier: param_disable_default_roadvehicles
    name_str: Hide Default OpenTTD road vehicles?
    desc_str: Hide the default OpenTTD road vehicles from the vehicle list
    min_value: 0
    max_value: 1
    def_value: 1
    names:
      0: Show Default OpenTTD road vehicles
      1: Hide Default OpenTTD road vehicles

global_vehicle_switches: []

global_actions:
  - condition: param_disable_default_trains == 1
    action: disable_item(FEAT_TRAINS)
  - condition: param_disable_default_roadvehicles == 1
    action: disable_item(FEAT_ROADVEHS)
