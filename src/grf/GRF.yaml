grf:
  grfid: BRM3
  short_name: BRMetro
  name: BRMetro
  description: UK tram and metro vehicles for BRTrains

versioning:
  version: 1
  compatible_version: 1

purchase_list:
  order: grouped

params:
  - identifier: param_speed_mode
    name_str: Speed Mode
    desc_str: Use each unit's design speed, or its permitted service speed
    min_value: 0
    max_value: 1
    def_value: 1
    names:
      0: Service Speed
      1: Design Speed

  - identifier: param_capacity_scaling
    name_str: Capacity Scaling
    desc_str: Scale vehicle capacities
    min_value: 1
    max_value: 4
    def_value: 1
    names:
      1: 1x
      2: 2x
      3: 3x
      4: 4x

  - identifier: param_disable_default_trains
    name_str: Hide Default OpenTTD trains?
    desc_str: Hide the default OpenTTD trains from the vehicle list
    min_value: 0
    max_value: 1
    def_value: 1
    names:
      0: Show Default OpenTTD trains
      1: Hide Default OpenTTD trains

  - identifier: param_disable_default_roadvehicles
    name_str: Hide Default OpenTTD road vehicles?
    desc_str: Hide the default OpenTTD road vehicles from the vehicle list
    min_value: 0
    max_value: 1
    def_value: 1
    names:
      0: Show Default OpenTTD road vehicles
      1: Hide Default OpenTTD road vehicles

  - identifier: param_show_trams_as_trains
    name_str: Show trams as trains
    desc_str: Which tram vehicles should also be available as trains?
    min_value: 0
    max_value: 2
    def_value: 0
    names:
      0: Never
      1: Tram-trains only
      2: Always

  - identifier: param_show_trains_as_trams
    name_str: Show trains as trams
    desc_str: Which train vehicles should also be available as trams?
    min_value: 0
    max_value: 4
    def_value: 0
    names:
      0: Never
      1: Light vehicles only
      2: Light vehicles and London Underground
      3: Metro trains
      4: Metro and suburban trains

global_vehicle_switches: []

global_actions:
  - condition: param_disable_default_trains == 1
    action: disable_item(FEAT_TRAINS)
  - condition: param_disable_default_roadvehicles == 1
    action: disable_item(FEAT_ROADVEHS)

usage_filters:
  - feature: FEAT_TRAINS
    parameter: param_show_trams_as_trains
    default_minimum: 2
    minimum:
      TRAM_TRAIN: 1
      TRAM: 2
  - feature: FEAT_ROADVEHS
    parameter: param_show_trains_as_trams
    minimum:
      LIGHT_RAIL: 1
      UNDERGROUND: 2
      METRO: 3
      SUBURBAN: 4
      COMMUTER: 4
      LOCAL: 4
      REGIONAL: 4
