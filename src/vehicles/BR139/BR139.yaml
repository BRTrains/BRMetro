  introduction_date: 2009-06-01

profiles:
  - identifier: DEFAULT
    num_vehicles: 1
    capacity: 50
    types: [train, tram]

# Order is the legacy `switch(FEAT_TRAINS, SELF, sw_BR139, cargo_subtype)` (0..4), whose
# `sw_BR139_cargo_subtype_text` names each subtype, and each band's own pixels were
# measured (`BRTrains3-artwork-tools/probe_br139_features.py`, `probe_br139_maps.py`):
# y=13 grey body with green warning panels, y=33 grey body with the purple/orange London
# Midland scheme, y=53 and y=73 two blue-and-grey prototype drawings, y=93 a grey body
# with a blue/cyan window band. The legacy's livery list string names only London Midland
# and West Midlands Railway; the remaining three are the prototype schemes the changelog
# records ("Added Prototype liveries for Class 139"). Which grey band is the West Midlands
# Railway scheme (and which blue band is which prototype) is recorded as a query in the
# oddities file.
liveries:
  - name: 'London Midland'
    special_tags: [operator/London Midland]
  - name: 'West Midlands Railway'
    special_tags: [operator/West Midlands Railway]
  - name: 'Parry People Mover - Prototype'
    special_tags: [operator/Pre-Metro Operations]
  - name: 'Bristol Electric - Prototype'
    special_tags: [operator/Bristol Electric Railbus]
  # The legacy string is `str_GoCoop` ": (Go Coperative)" — misspelled, and naming the
  # group rather than the operator (the Go-Ahead Group whose 2009 bid for the Stourbridge
  # branch ran the prototype). Kept as the legacy's own wording; query in the oddities file.
  - name: 'Go Coperative'
    special_tags: [operator/Go-Ahead Group]
